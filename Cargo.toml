[package]
name = "nsfw-api"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "Self-hosted image moderation API (nudity, weapons, gore, drugs), ready for Railway."

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
fast_image_resize = "6"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
# No text and no embedded raster images: an uploaded SVG can't reach fonts or files.
resvg = { version = "0.49", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors"] }
tract-onnx = "0.23"

[features]
# AVIF uploads, decoded by the system's libdav1d (needs pkg-config and libdav1d-dev to build).
avif = ["image/avif-native"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
